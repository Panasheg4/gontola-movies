<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin — Gontola Movies{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="admin-body">

<div class="admin-layout">

    <aside class="admin-sidebar">
        <div class="admin-sidebar-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 alt="Gontola Movies"
                 class="admin-logo-img">
            <span class="admin-logo-text">Admin</span>
        </div>

        <nav class="admin-nav">
            <a href="{{ url_for('admin.dashboard') }}"
               class="admin-nav-item {% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
                <i class="fa-solid fa-gauge"></i>
                Dashboard
            </a>
            <a href="{{ url_for('admin.movies') }}"
               class="admin-nav-item {% if request.endpoint == 'admin.movies' %}active{% endif %}">
                <i class="fa-solid fa-film"></i>
                All Movies
            </a>
            <a href="{{ url_for('admin.add_movie') }}"
               class="admin-nav-item {% if request.endpoint == 'admin.add_movie' %}active{% endif %}">
                <i class="fa-solid fa-plus"></i>
                Add Movie
            </a>
            <a href="{{ url_for('admin.blocklist') }}"
               class="admin-nav-item {% if request.endpoint == 'admin.blocklist' %}active{% endif %}">
                <i class="fa-solid fa-ban"></i>
                Blocklist
            </a>
            <a href="{{ url_for('main.index') }}"
               target="_blank"
               class="admin-nav-item">
                <i class="fa-solid fa-globe"></i>
                View Website
            </a>
            <a href="{{ url_for('admin.logout') }}"
               class="admin-nav-item danger">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>
        </nav>
    </aside>

    <main class="admin-main">
        {% block content %}{% endblock %}
    </main>

</div>

</body>
</html>
